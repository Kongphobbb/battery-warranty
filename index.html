const fmtTHB = (n) => new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(n)||0);
const fmtNum = (n) => new Intl.NumberFormat('th-TH').format(Number(n)||0);
const toDate = (d) => (d && d.toDate) ? d.toDate() : (d ? new Date(d) : null);
const fmtDate = (d) => { const dt = toDate(d); return dt ? dt.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric'}) : '-'; };
const fmtDateTime = (d) => { const dt = toDate(d); return dt ? dt.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-'; };
const toDateInput = (d) => { const dt = toDate(d)||new Date(); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
const daysBetween = (a,b) => Math.ceil((b-a)/86400000);

function warrantyStatus(endDate) {
  const end = toDate(endDate); const now = new Date();
  if (!end) return { status:'EXPIRED', daysLeft:0 };
  if (now <= end) return { status:'ACTIVE', daysLeft: daysBetween(now, end) };
  return { status:'EXPIRED', daysLeft: -daysBetween(end, now) };
}
function computeExpiry(startDate, months) {
  const d = toDate(startDate) || new Date();
  const x = new Date(d); x.setMonth(x.getMonth() + Number(months||12));
  return x;
}
function downloadCSV(filename, rows) {
  if (!rows || !rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = (v) => { if (v==null) return ''; const s=String(v).replace(/"/g,'""'); return /[",\n]/.test(s)?`"${s}"`:s; };
  const csv = [headers.join(','), ...rows.map(r=>headers.map(h=>esc(r[h])).join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

async function createWarranty(data, admin) {
  const serial = (data.serialNumber||'').trim().toUpperCase();
  if (!serial) throw new Error('กรุณากรอก Serial Number');

  // ตรวจสอบว่า Serial นี้มีอยู่แล้วหรือไม่
  const exist = await db.collection('publicWarranty').doc(serial).get();
  if (exist.exists) throw new Error('Serial Number นี้มีอยู่ในระบบแล้ว');

  // คำนวณวันหมดอายุ
  const startDate = toDate(data.startDate) || new Date();
  const months = Number(data.months) || 12;
  const endDate = computeExpiry(startDate, months);

  // สร้างข้อมูลหลักใน warranties
  const ref = await db.collection('warranties').add({
    serialNumber: serial,
    productId: data.productId || '',
    productName: data.productName || '',
    purchaseDate: data.purchaseDate || '',
    startDate: data.startDate || '',
    endDate: endDate,
    months: months,
    customerName: data.customerName || '',
    createdAt: FieldValue.serverTimestamp(),
    updatedAt: FieldValue.serverTimestamp()
  });

  // สร้างข้อมูล Public lookup (ใช้ Serial เป็น ID)
  await db.collection('publicWarranty').doc(serial).set({
    productName: data.productName || '',
    serialNumber: serial,
    purchaseDate: data.purchaseDate || '',
    startDate: data.startDate || '',
    endDate: endDate,
    months: months,
    customerName: data.customerName || '',
    createdAt: FieldValue.serverTimestamp()
  });

  await logAudit(admin, 'CREATE_WARRANTY', {
    warrantyId: ref.id,
    serialNumber: serial,
    productName: data.productName
  });

  return ref.id;
}

async function adjustStock(productId, delta, reason, admin) {
  if (!Number.isFinite(delta) || delta===0) throw new Error('จำนวนไม่ถูกต้อง');
  const ref = db.collection('products').doc(productId);
  const result = await db.runTransaction(async (tx) => {
    const snap = await tx.get(ref);
    if (!snap.exists) throw new Error('ไม่พบสินค้า');
    const cur = snap.data().stock||0;
    const next = cur + delta;
    if (next < 0) throw new Error('Stock ไม่พอสำหรับการลด');
    tx.update(ref, {stock:next, updatedAt: FieldValue.serverTimestamp()});
    return {before:cur, after:next};
  });
  await db.collection('stockMovements').add({ productId, delta, reason,
    before: result.before, after: result.after, by: admin?.email||admin?.uid, at: FieldValue.serverTimestamp() });
  await logAudit(admin, delta>0?'STOCK_IN':'STOCK_OUT', {productId, delta, reason, before:result.before, after:result.after});
  return result;
}

/* =============================================================
   SERVICES: STORAGE (Base64 → Firestore)
   ============================================================= */
async function optimizeImageToBase64(file, maxSize=600, quality=0.55, targetKB=150) {
  if (!file.type.startsWith('image/')) throw new Error('ไฟล์ต้องเป็นรูปภาพ');
  if (file.size > 5*1024*1024) throw new Error('ไฟล์ใหญ่เกิน 5MB');

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let currentMax = maxSize;
        let currentQ = quality;
        let dataUrl = '';
        let sizeKB = 0;

        // ลดขนาดซ้ำๆ จนได้ตาม target
        for (let i = 0; i < 6; i++) {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          const scale = Math.min(1, currentMax / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          dataUrl = canvas.toDataURL('image/jpeg', currentQ);

          // ประมาณขนาดเป็น KB
          const base64Len = dataUrl.length - 'data:image/jpeg;base64,'.length;
          sizeKB = (base64Len * 0.75) / 1024;

          if (sizeKB <= targetKB) break;

          // ลดลงเรื่อยๆ
          currentMax = Math.round(currentMax * 0.75);
          currentQ = Math.max(0.3, currentQ - 0.1);
        }

        resolve({ dataUrl, sizeKB: Math.round(sizeKB) });
      };
      img.onerror = () => reject(new Error('ไม่สามารถโหลดรูปได้'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
}

async function uploadImage(folder, id, file, name='image') {

const AuthContext = createContext(null);
const ToastContext = createContext(null);

function AuthProvider({children}) {
  const [user, setUser] = useState(null);
  const [role, setRole] = useState(null);
  const [roleError, setRoleError] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (u) {
        setLoading(true);
        let result = { role: null, exists: false, error: null };
        for (let i = 0; i < 3; i++) {
          result = await fetchUserRole(u.uid);
          if (result.exists) break;
          if (i < 2) await new Promise(x => setTimeout(x, 400));
        }
        setRole(result.role); setRoleError(result.error); setUser(u); setLoading(false);
      } else {
        setUser(null); setRole(null); setRoleError(null); setLoading(false);
      }
    });
    return () => unsub();
  }, []);

  const value = { user, role, roleError, isAdmin: role === 'admin', loading, logout: () => auth.signOut() };
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}
const useAuth = () => useContext(AuthContext);

function ToastProvider({children}) {
  const [items, setItems] = useState([]);
  const push = useCallback((message, type='info', timeout=3200) => {
    const id = Math.random().toString(36).slice(2);
    setItems(prev=>[...prev,{id,message,type}]);
    setTimeout(()=>setItems(prev=>prev.filter(i=>i.id!==id)), timeout);
  },[]);
  const api = { success:(m)=>push(m,'success'), error:(m)=>push(m,'error'), info:(m)=>push(m,'info') };
  return (
    <ToastContext.Provider value={api}>
      {children}
      <div className="fixed z-[100] top-4 right-4 left-4 sm:left-auto sm:w-96 flex flex-col gap-2">
        {items.map(i=>(
          <div key={i.id} className={`fade-in rounded-xl px-4 py-3 shadow-lg text-white text-sm
            ${i.type==='success'?'bg-emerald-600':i.type==='error'?'bg-rose-600':'bg-slate-800'}`}>
            {i.message}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast = () => useContext(ToastContext);

function Button({children, variant='primary', size='md', className='', ...rest}) {
  const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed';
  const variants = {
    primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm',
    secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-700',
    danger: 'bg-rose-600 hover:bg-rose-700 text-white',
    ghost: 'hover:bg-slate-100 text-slate-700',
    outline: 'border border-slate-300 bg-white hover:bg-slate-50 text-slate-700',
    success: 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
  };
  const sizes = { sm:'px-3 py-1.5 text-sm', md:'px-4 py-2.5 text-sm', lg:'px-5 py-3 text-base' };
  return <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>{children}</button>;
}

function Input({label, error, hint, className='', as='input', children, ...rest}) {
  const base = 'w-full rounded-lg border px-3.5 py-2.5 text-sm outline-none transition bg-white ' +
    (error ? 'border-rose-400 focus:border-rose-500 focus:ring-2 focus:ring-rose-100'
           : 'border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-100');
  return (
    <label className="block">
      {label && <span className="block text-sm font-medium text-slate-700 mb-1.5">{label}</span>}
      {as==='textarea' ? <textarea className={`${base} ${className}`} {...rest}/>
        : as==='select' ? <select className={`${base} ${className}`} {...rest}>{children}</select>
        : <input className={`${base} ${className}`} {...rest}/>}
      {error && <span className="block mt-1 text-xs text-rose-600">{error}</span>}
      {hint && !error && <span className="block mt-1 text-xs text-slate-500">{hint}</span>}
    </label>
  );
}

function Card({title, action, children, className=''}) {
  return (
    <div className={`bg-white rounded-2xl border border-slate-200 shadow-sm ${className}`}>
      {(title||action) && (
        <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100">
          <h3 className="font-semibold text-slate-800">{title}</h3>{action}
        </div>
      )}
      <div className="p-5">{children}</div>
    </div>
  );
}

const badgeMap = {
  green:'bg-emerald-50 text-emerald-700 border-emerald-200',
  red:'bg-rose-50 text-rose-700 border-rose-200',
  amber:'bg-amber-50 text-amber-700 border-amber-200',
  blue:'bg-blue-50 text-blue-700 border-blue-200',
  slate:'bg-slate-100 text-slate-700 border-slate-200',
  purple:'bg-purple-50 text-purple-700 border-purple-200'
};
function Badge({color='slate', children, className=''}) {
  return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${badgeMap[color]} ${className}`}>{children}</span>;
}

function Spinner({label='กำลังโหลดข้อมูล...'}) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 py-10 text-slate-500">
      <div className="w-8 h-8 rounded-full border-2 border-slate-200 border-t-brand-600 animate-spin" />
      <span className="text-sm">{label}</span>
    </div>
  );
}

function EmptyState({title='ไม่พบข้อมูล', description, icon='📦'}) {
  return (
    <div className="flex flex-col items-center justify-center py-12 text-center">
      <div className="text-4xl mb-3">{icon}</div>
      <h4 className="font-medium text-slate-700">{title}</h4>
      {description && <p className="text-sm text-slate-500 mt-1 max-w-sm">{description}</p>}
    </div>
  );
}

function Modal({open, onClose, title, children, footer, size='md'}) {
  if (!open) return null;
  const w = {sm:'max-w-sm', md:'max-w-lg', lg:'max-w-3xl', xl:'max-w-5xl'}[size];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50" onClick={onClose}>
      <div className={`w-full ${w} bg-white rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col`} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <h3 className="font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>
        <div className="p-5 overflow-y-auto flex-1">{children}</div>
        {footer && <div className="px-5 py-4 border-t border-slate-100 bg-slate-50">{footer}</div>}
      </div>
    </div>
  );
}

function Confirm({open, onClose, onConfirm, title='ยืนยัน', message, confirmText='ยืนยัน', danger}) {
  return (
    <Modal open={open} onClose={onClose} title={title} size="sm"
      footer={<div className="flex justify-end gap-2">
        <Button variant="secondary" onClick={onClose}>ยกเลิก</Button>
        <Button variant={danger?'danger':'primary'} onClick={onConfirm}>{confirmText}</Button>
      </div>}>
      <p className="text-slate-600 whitespace-pre-line">{message}</p>
    </Modal>
  );
}

/* ✅ FIX: ใช้ new window.Chart เพื่อไม่ให้ชนกับชื่อ component ChartBox */
function ChartBox({type='line', data, options={}, height=260}) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  useEffect(()=>{
    if (!canvasRef.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current.getContext('2d'), {type, data, options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom',labels:{font:{family:'Sarabun'}}}},
      ...options
    }});
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, JSON.stringify(data), JSON.stringify(options)]);
  return <div style={{height}}><canvas ref={canvasRef}/></div>;
}

/* ---------- Image Uploader (single) ---------- */
function SingleImageUploader({value, onChange, folder='misc', id='temp', name='image', aspect='aspect-video', label='อัปโหลดรูป'}) {
  const toast = useToast();
  const inputRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);

  const handleFile = async (file) => {
    if (!file) return;
    if (file.size > 8*1024*1024) { toast.error('ไฟล์ใหญ่เกิน 8MB'); return; }
    setBusy(true);
    try {
      const { url, path } = await uploadImage(folder, id, file, name);
      if (value?.path) await deleteFile(value.path);
      onChange({ url, path });
      toast.success('อัปโหลดสำเร็จ');
    } catch(e) { toast.error(e.message||'อัปโหลดไม่สำเร็จ'); }
    finally { setBusy(false); if (inputRef.current) inputRef.current.value=''; }
  };

  const remove = async () => {
    if (value?.path) await deleteFile(value.path);
    onChange(null);
  };

  return (
    <div className="space-y-3">
      <div
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files?.[0]);}}
        onClick={()=>inputRef.current?.click()}
        className={`border-2 border-dashed rounded-2xl overflow-hidden cursor-pointer transition
          ${drag?'border-brand-500 bg-brand-50':'border-slate-300 hover:border-brand-400 hover:bg-slate-50'}`}>
        {value?.url ? (
          <img src={value.url} alt="" className={`w-full ${aspect} object-cover`} />
        ) : (
          <div className={`${aspect} grid place-items-center text-center p-4`}>
            <div>
              <div className="text-3xl mb-2">📷</div>
              <div className="font-medium text-slate-700">{label}</div>
              <div className="text-xs text-slate-500 mt-1">คลิกหรือลากรูปมาวาง</div>
              <div className="text-xs text-slate-400 mt-1">JPG, PNG, WEBP (ระบบจะบีบให้อัตโนมัติ ~150KB)</div>
            </div>
          </div>
        )}
        <input ref={inputRef} type="file" accept="image/jpeg,image/png,image/webp" hidden
               onChange={e=>handleFile(e.target.files?.[0])}/>
      </div>
      {busy && <div className="text-sm text-brand-600">กำลังอัปโหลด...</div>}
      {value?.url && (
        <div className="flex gap-2">
          <Button size="sm" variant="outline" onClick={()=>inputRef.current?.click()}>เปลี่ยนรูป</Button>
          <Button size="sm" variant="danger" onClick={remove}>ลบรูป</Button>
        </div>
      )}
    </div>
  );
}

/* ---------- Image Uploader (multi) ---------- */
function ImageUploader({images=[], onChange, productId}) {
  const toast = useToast();
  const inputRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleFiles = async (files) => {
    const list = Array.from(files||[]);
    if (!list.length) return;
    setBusy(true);
    setProgress(0);
    try {
      let done = 0;
      const results = await Promise.all(
        list.map(async (f, i) => {
          if (f.size > 8*1024*1024) { toast.error(`${f.name} ใหญ่เกิน 8MB`); return null; }
          try {
            const {url, path} = await uploadProductImage(productId||'temp', f, images.length+i);
            done++;
            setProgress(Math.round((done/list.length)*100));
            return {url, path, isMain: images.length===0 && i===0};
          } catch(err) {
            toast.error(`${f.name}: ${err.message||'อัปโหลดล้มเหลว'}`);
            return null;
          }
        })
      );
      const uploaded = results.filter(Boolean);
const next = [...images, ...uploaded];

// ✅ ประมาณขนาดทั้งหมด (Base64)
const totalBytes = next.reduce((sum, img) => {
  if (!img?.url?.startsWith('data:')) return sum;
  const base64 = img.url.split(',')[1] || '';
  return sum + Math.round(base64.length * 0.75);
}, 0);

if (totalBytes > 850 * 1024) {
  toast.error('รูปทั้งหมดใหญ่เกินไปสำหรับ Firestore (1MB) กรุณาลบรูปเก่าออกก่อน');
  return;
}

onChange(next);
toast.success(`อัปโหลด ${uploaded.length} รูปสำเร็จ`);      onChange([...images, ...uploaded]);
      const totalKB = uploaded.reduce((s, x) => s + (x.sizeKB || 0), 0);
toast.success(`อัปโหลด ${uploaded.length} รูปสำเร็จ (${totalKB} KB)`);
    } catch(e) { toast.error(e.message||'อัปโหลดไม่สำเร็จ'); }
    finally { setBusy(false); setProgress(0); if (inputRef.current) inputRef.current.value=''; }
  };

  const onDrop = (e) => { e.preventDefault(); setDrag(false); handleFiles(e.dataTransfer.files); };
  const removeAt = async (i) => {
    const img = images[i];
    if (img.path) await deleteFile(img.path);
    const next = images.filter((_,idx)=>idx!==i);
    if (next.length && !next.some(x=>x.isMain)) next[0]={...next[0],isMain:true};
    onChange(next);
  };
  const setMain = (i) => onChange(images.map((im,idx)=>({...im,isMain:idx===i})));

  return (
    <div className="space-y-3">
      <div onDragOver={e=>{e.preventDefault();setDrag(true);}}
           onDragLeave={()=>setDrag(false)} onDrop={onDrop}
           onClick={()=>inputRef.current?.click()}
           className={`border-2 border-dashed rounded-2xl p-6 sm:p-8 text-center cursor-pointer transition
             ${drag?'border-brand-500 bg-brand-50':'border-slate-300 hover:border-brand-400 hover:bg-slate-50'}`}>
        <div className="text-3xl mb-2">📷</div>
        <p className="font-medium text-slate-700">เพิ่มรูปสินค้า</p>
        <p className="text-sm text-slate-500 mt-1">คลิกเพื่อเลือกรูปภาพ หรือลากรูปมาวาง (เลือกหลายรูปพร้อมกันได้)</p>
        <p className="text-xs text-slate-400 mt-2">JPG, PNG, WEBP (บีบอัตโนมัติ · รวมไม่เกิน 1MB)</p>
        <input ref={inputRef} type="file" accept="image/jpeg,image/png,image/webp" multiple hidden
               onChange={e=>handleFiles(e.target.files)}/>
      </div>
      {busy && (
        <div className="space-y-1">
          <div className="flex items-center justify-between text-sm text-brand-600">
            <span>กำลังอัปโหลด...</span>
            <span className="font-semibold">{progress}%</span>
          </div>
          <div className="h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div className="h-full bg-brand-500 transition-all duration-200" style={{width:`${progress}%`}}/>
          </div>
        </div>
      )}
      {images.length>0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
          {images.map((img,i)=>(
            <div key={img.url} className="relative group rounded-xl overflow-hidden border border-slate-200 bg-white">
              <img src={img.url} alt="" className="aspect-square object-cover w-full"/>
              {img.isMain && <span className="absolute top-2 left-2 bg-brand-600 text-white text-xs px-2 py-0.5 rounded-full">รูปหลัก</span>}
              <div className="absolute inset-x-0 bottom-0 p-2 flex gap-1 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition">
                {!img.isMain && <Button size="sm" variant="secondary" onClick={e=>{e.stopPropagation();setMain(i);}}>ตั้งหลัก</Button>}
                <Button size="sm" variant="danger" onClick={e=>{e.stopPropagation();removeAt(i);}}>ลบ</Button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------- Product Image Gallery (for detail modal) ---------- */
function ProductImageGallery({images = [], productName = ''}) {
  const [current, setCurrent] = useState(0);

  useEffect(() => { setCurrent(0); }, [images]);

  const go = useCallback((i) => {
    if (!images.length) return;
    if (i < 0) i = images.length - 1;
    if (i >= images.length) i = 0;
    setCurrent(i);
  }, [images.length]);

  useEffect(() => {
    if (images.length <= 1) return;
    const onKey = (e) => {
      if (e.key === 'ArrowLeft') go(current - 1);
      if (e.key === 'ArrowRight') go(current + 1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [current, images.length, go]);

  if (!images || images.length === 0) {
    return (
      <div className="aspect-square rounded-2xl overflow-hidden bg-slate-100 border border-slate-200">
        <div className="w-full h-full grid place-items-center text-slate-300 text-6xl">🔋</div>
      </div>
    );
  }

  return (
    <div>
      <div className="relative aspect-square rounded-2xl overflow-hidden bg-slate-100 border border-slate-200 group select-none">
        <img
          src={images[current].url}
          alt={productName}
          className="w-full h-full object-cover"
        />
        {images.length > 1 && (
          <>
            <button
              type="button"
              onClick={() => go(current - 1)}
              className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/70 text-white grid place-items-center backdrop-blur transition opacity-0 group-hover:opacity-100 text-2xl leading-none pb-1"
              aria-label="ก่อนหน้า"
            >‹</button>
            <button
              type="button"
              onClick={() => go(current + 1)}
              className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 hover:bg-black/70 text-white grid place-items-center backdrop-blur transition opacity-0 group-hover:opacity-100 text-2xl leading-none pb-1"
              aria-label="ถัดไป"
            >›</button>
            <div className="absolute bottom-2 left-1/2 -translate-x-1/2 bg-black/55 text-white text-xs px-3 py-1 rounded-full backdrop-blur">
              {current + 1} / {images.length}
            </div>
          </>
        )}
      </div>

      {images.length > 1 && (
        <div className="grid grid-cols-4 gap-2 mt-2">
          {images.map((img, i) => (
            <button
              key={i}
              type="button"
              onClick={() => setCurrent(i)}
              className={`aspect-square rounded-lg overflow-hidden border-2 bg-slate-100 transition
                ${i === current
                  ? 'border-blue-500 ring-2 ring-blue-200'
                  : 'border-slate-200 hover:border-slate-400 opacity-80 hover:opacity-100'}`}
            >
              <img src={img.url} alt="" className="w-full h-full object-cover"/>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
function ContactCard({contact}) {
  const link = resolveContactLink(contact);
  return (
    <a href={link} target="_blank" rel="noreferrer"
       className="bg-slate-50 rounded-2xl border border-slate-200 p-4 flex flex-col items-center text-center hover:border-blue-300 hover:shadow-md hover:bg-white transition group">
      <div className="text-3xl mb-2 group-hover:scale-110 transition">{contact.icon || '🔗'}</div>
      <div className="font-medium text-slate-800 text-sm">{contact.label}</div>
      <div className="text-xs text-slate-500 mt-1 break-all line-clamp-2">{contact.value}</div>
    </a>
  );
}

function resolveContactLink(c) {
  if (c.link) return c.link;
  const v = c.value || '';
  switch (c.type) {
    case 'line':     return `https://line.me/R/ti/p/${v.replace(/^@/,'%40')}`;
    case 'facebook': return v.startsWith('http') ? v : `https://facebook.com/${v}`;
    case 'phone':    return `tel:${v.replace(/[^\d+]/g,'')}`;
    case 'email':    return `mailto:${v}`;
    case 'tiktok':   return v.startsWith('http') ? v : `https://tiktok.com/@${v.replace(/^@/,'')}`;
    case 'website':  return v.startsWith('http') ? v : `https://${v}`;
    default:         return v.startsWith('http') ? v : `https://${v}`;
  }
}

function ProductsPublicPage() {

    } finally { setLoading(false); }

  const filtered = useMemo(()=>{

      if (!q) return true;

/* =============================================================
   CHECK WARRANTY PAGE
   ============================================================= */
function CheckWarrantyPage() {
  const [serial, setSerial] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [attempts, setAttempts] = useState(0);
  const [cooldown, setCooldown] = useState(false);
  const lastReq = useRef(0);

  useEffect(() => { if (cooldown) { const t=setTimeout(()=>setCooldown(false), 5000); return ()=>clearTimeout(t); } }, [cooldown]);

  const submit = async (e) => {
    e?.preventDefault();
    const clean = serial.trim().toUpperCase();
    if (!clean) { setError('กรุณากรอก Serial Number'); return; }
    if (cooldown) return;
    const now = Date.now();
    if (now - lastReq.current < 1500) { setError('กรุณารอสักครู่ก่อนตรวจสอบอีกครั้ง'); return; }
    lastReq.current = now;
    setError(''); setResult(null); setLoading(true);
    try {
      const data = await lookupWarranty(clean);
      if (!data) {
        const n = attempts+1; setAttempts(n);
        if (n >= 5) { setCooldown(true); setAttempts(0); }
        setResult({type:'notfound'});
      } else {
        setAttempts(0);
        const s = warrantyStatus(data.endDate);
        setResult({ type: s.status === 'ACTIVE' ? 'active' : 'expired', data, daysLeft: s.daysLeft });
      }
    } catch (err) { setError('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง'); }
    finally { setLoading(false); }
  };

  const Row = ({label, value}) => (
    <div>
      <dt className="text-slate-500">{label}</dt>
      <dd className="font-medium text-slate-800">{value||'-'}</dd>
    </div>
  );

  return (
    <div className="max-w-2xl mx-auto px-4 py-10 sm:py-16">
      <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
        <h1 className="text-2xl font-bold text-slate-900">ตรวจสอบการรับประกัน</h1>
        <p className="text-slate-500 mt-1 text-sm">กรอก Serial Number ที่อยู่บนตัวสินค้า</p>
        <form onSubmit={submit} className="mt-6 space-y-4">
          <Input label="Serial Number" placeholder="BAT-2026-00125" value={serial}
                 onChange={e=>setSerial(e.target.value.toUpperCase())}
                 error={error} autoFocus disabled={cooldown}/>
          <Button type="submit" size="lg" disabled={loading||cooldown} className="w-full">
            {loading?'กำลังตรวจสอบ...':cooldown?'รอสักครู่...':'ตรวจสอบประกัน'}
          </Button>
        </form>

        {loading && <Spinner label="กำลังค้นหาข้อมูล..."/>}

        {!loading && result?.type==='active' && (
          <div className="fade-in mt-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-5">
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              <span className="text-2xl">✓</span>
              <span className="font-semibold text-emerald-800">พบข้อมูลแบตเตอรี่</span>
              <Badge color="green">อยู่ในประกัน</Badge>
            </div>
            <dl className="grid sm:grid-cols-2 gap-x-4 gap-y-3 text-sm">
              <Row label="สินค้า" value={result.data.productName}/>
              <Row label="Serial Number" value={result.data.serialNumber}/>
              <Row label="วันที่ซื้อ" value={fmtDate(result.data.purchaseDate||result.data.startDate)}/>
              <Row label="เริ่มรับประกัน" value={fmtDate(result.data.startDate)}/>
              <Row label="วันหมดประกัน" value={fmtDate(result.data.endDate)}/>
              <Row label="ระยะเวลา" value={`${result.data.months} เดือน`}/>
            </dl>
            <div className="mt-4 text-emerald-800 font-medium">เหลืออีก {result.daysLeft} วัน</div>
          </div>
        )}

        {!loading && result?.type==='expired' && (
          <div className="fade-in mt-6 rounded-2xl border border-rose-200 bg-rose-50 p-5">
            <div className="flex items-center gap-2 mb-3 flex-wrap">
              <span className="text-2xl">✕</span>
              <span className="font-semibold text-rose-800">หมดระยะเวลารับประกัน</span>
              <Badge color="red">หมดประกัน</Badge>
            </div>
            <dl className="grid sm:grid-cols-2 gap-x-4 gap-y-3 text-sm">
              <Row label="สินค้า" value={result.data.productName}/>
              <Row label="Serial Number" value={result.data.serialNumber}/>
              <Row label="วันหมดประกัน" value={fmtDate(result.data.endDate)}/>
            </dl>
          </div>
        )}

        {!loading && result?.type==='notfound' && (
          <div className="fade-in mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-5 text-slate-700">
            <div className="font-semibold mb-1">ไม่พบข้อมูล Serial Number นี้</div>
            <div className="text-sm">กรุณาตรวจสอบ Serial Number และลองใหม่อีกครั้ง</div>
          </div>
        )}
      </div>
    </div>
  );
}

/* =============================================================
   ADMIN LOGIN
   ============================================================= */
function LoginPage() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const toast = useToast();
  const { user, isAdmin, loading: authLoading, logout } = useAuth();

  useEffect(() => {
    if (authLoading) return;
    if (user && isAdmin && window.location.hash !== '#/admin/dashboard') {
      window.location.hash = '#/admin/dashboard';
    }
  }, [user, isAdmin, authLoading]);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!email || !password) { setError('กรุณากรอกอีเมลและรหัสผ่าน'); return; }
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
      toast.success('เข้าสู่ระบบสำเร็จ');
    } catch(err) {
      const msg = err.code==='auth/invalid-credential'||err.code==='auth/wrong-password'
          ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'
        : err.code==='auth/user-not-found' ? 'ไม่พบบัญชีผู้ใช้'
        : err.code==='auth/invalid-email' ? 'รูปแบบอีเมลไม่ถูกต้อง'
        : err.code==='auth/operation-not-allowed' ? 'ยังไม่เปิดใช้ Email/Password'
        : err.code==='auth/too-many-requests' ? 'พยายามหลายครั้งเกินไป'
        : `เข้าสู่ระบบไม่สำเร็จ (${err.code||'unknown'})`;
      setError(msg);
    } finally { setLoading(false); }
  };

  const signedInButNotAdmin = !authLoading && user && !isAdmin;

  return (
    <div className="min-h-screen grid place-items-center bg-gradient-to-br from-slate-100 to-slate-50 p-4">
      <div className="w-full max-w-md">
        <a href="#/" className="flex items-center gap-2 justify-center mb-6">
          <div className="w-10 h-10 rounded-xl bg-brand-600 grid place-items-center text-white font-bold">B</div>
          <span className="font-semibold text-slate-800">Battery Warranty</span>
        </a>
        <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8">
          <h1 className="text-2xl font-bold text-slate-900">Admin Login</h1>
          <p className="text-sm text-slate-500 mt-1">สำหรับผู้ดูแลระบบเท่านั้น</p>

          {signedInButNotAdmin ? (
            <div className="mt-6 space-y-4">
              <div className="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
                <div className="font-semibold mb-1">⚠️ บัญชีนี้ไม่มีสิทธิ์ Admin</div>
                <p>เข้าสู่ระบบด้วย <b>{user.email}</b> สำเร็จ แต่ไม่พบ role <code>admin</code></p>
                <p className="mt-2 text-xs">UID: <code className="break-all">{user.uid}</code></p>
              </div>
              <Button variant="outline" className="w-full" onClick={logout}>ออกจากระบบแล้วลองใหม่</Button>
            </div>
          ) : (
            <form onSubmit={submit} className="mt-6 space-y-4">
              <Input label="อีเมล" type="email" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="username"/>
              <Input label="รหัสผ่าน" type="password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password"/>
              {error && <div className="text-sm text-rose-600 bg-rose-50 border border-rose-200 px-3 py-2 rounded-lg">{error}</div>}
              <Button type="submit" size="lg" className="w-full" disabled={loading||authLoading}>
                {loading?'กำลังเข้าสู่ระบบ...':authLoading?'กำลังตรวจสอบ...':'เข้าสู่ระบบ'}
              </Button>
            </form>
          )}
          <div className="mt-4 text-center text-xs text-slate-500">
            <a href="#/" className="hover:text-brand-700">← กลับสู่หน้าหลัก</a>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =============================================================
   ADMIN: CATEGORIES
   ============================================================= */
function CategoriesPage() {
  const { user } = useAuth();
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [deleteTarget, setDeleteTarget] = useState(null);

  const load = async () => {
    setLoading(true);
    try {
      const [c, p] = await Promise.all([listCategories(), listProducts()]);
      setItems(c); setProducts(p);
    } catch { toast.error('โหลดไม่สำเร็จ'); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ load(); },[]);

  const countByCategory = useMemo(()=>{
    const map = {};
    products.forEach(p=>{
      const catId = p.categoryId || p.category || '';
      if (catId) map[catId] = (map[catId]||0) + 1;
    });
    return map;
  },[products]);

  const openNew = () => setEditing({
    id: null, name:'', description:'', order: items.length, active:true, image:null
  });

  const openEdit = (c) => setEditing({ ...c, image: c.image || null });

  const save = async () => {
    if (!editing.name?.trim()) { toast.error('กรุณากรอกชื่อหมวดหมู่'); return; }
    setSaving(true);
    try {
      const payload = {
        name: editing.name.trim(),
        description: editing.description || '',
        order: Number(editing.order) || 0,
        active: editing.active !== false,
        image: editing.image || null
      };
      if (editing.id) {
        await updateCategory(editing.id, editing, payload, user);
        toast.success('อัปเดตหมวดหมู่สำเร็จ');
      } else {
        await createCategory(payload, user);
        toast.success('เพิ่มหมวดหมู่สำเร็จ');
      }
      setEditing(null);
      await load();
    } catch(e) { toast.error(e.message||'บันทึกไม่สำเร็จ'); }
    finally { setSaving(false); }
  };

  const confirmDelete = async () => {
    try {
      await deleteCategory(deleteTarget.id, deleteTarget, user);
      toast.success('ลบหมวดหมู่แล้ว');
      setDeleteTarget(null);
      await load();
    } catch(e) { toast.error(e.message||'ลบไม่สำเร็จ'); }
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold">หมวดหมู่สินค้า</h1>
          <p className="text-sm text-slate-500">จัดการหมวดหมู่ที่จะแสดงบนหน้าแรก</p>
        </div>
        <Button onClick={openNew}>+ เพิ่มหมวดหมู่</Button>
      </div>

      <Card>
        {loading ? <Spinner/> : items.length===0 ? (
          <EmptyState title="ยังไม่มีหมวดหมู่" description="กดปุ่ม '+ เพิ่มหมวดหมู่' เพื่อเริ่มต้น" icon="📂"/>
        ) : (
          <div className="grid sm:grid-cols-2 gap-4">
            {items.map(c=>(
              <div key={c.id} className="rounded-2xl border border-slate-200 overflow-hidden bg-white flex flex-col">
                <div className="aspect-[21/9] bg-slate-100">
                  {c.image?.url ? (
                    <img src={c.image.url} alt="" className="w-full h-full object-cover"/>
                  ) : (
                    <div className="w-full h-full grid place-items-center text-slate-300 text-4xl">🖼️</div>
                  )}
                </div>
                <div className="p-4 flex-1 flex flex-col">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="font-semibold text-slate-800 truncate">{c.name}</div>
                      <div className="text-xs text-slate-500 mt-0.5">สินค้า {countByCategory[c.id] || 0} รายการ · ลำดับ {c.order||0}</div>
                    </div>
                    {c.active === false ? <Badge color="slate">ปิด</Badge> : <Badge color="green">ใช้งาน</Badge>}
                  </div>
                  {c.description && <div className="text-sm text-slate-500 mt-2 line-clamp-2">{c.description}</div>}
                  <div className="mt-3 flex gap-2 justify-end">
                    <Button size="sm" variant="outline" onClick={()=>openEdit(c)}>แก้ไข</Button>
                    <Button size="sm" variant="danger" onClick={()=>setDeleteTarget(c)}>ลบ</Button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Modal
        open={!!editing}
        onClose={()=>setEditing(null)}
        title={editing?.id ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่'}
        size="lg"
        footer={<div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={()=>setEditing(null)}>ยกเลิก</Button>
          <Button onClick={save} disabled={saving}>{saving?'กำลังบันทึก...':'บันทึก'}</Button>
        </div>}
      >
        {editing && (
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-4">
              <Input label="ชื่อหมวดหมู่ *" value={editing.name}
                     onChange={e=>setEditing(x=>({...x,name:e.target.value}))}/>
              <Input label="ลำดับ" type="number" value={editing.order}
                     onChange={e=>setEditing(x=>({...x,order:e.target.value}))}/>
              <div className="sm:col-span-2">
                <Input as="textarea" rows={2} label="คำอธิบาย" value={editing.description}
                       onChange={e=>setEditing(x=>({...x,description:e.target.value}))}/>
              </div>
              <div className="sm:col-span-2">
                <label className="flex items-center gap-2">
                  <input type="checkbox" checked={editing.active !== false}
                         onChange={e=>setEditing(x=>({...x,active:e.target.checked}))}/>
                  <span>แสดงบนหน้าแรก</span>
                </label>
              </div>
            </div>
            <div>
              <div className="text-sm font-medium text-slate-700 mb-2">แบนเนอร์หมวดหมู่ (แนะนำอัตราส่วน 21:9)</div>
              <SingleImageUploader
                value={editing.image}
                onChange={img=>setEditing(x=>({...x,image:img}))}
                folder="categories"
                id={editing.id || `temp-${Date.now()}`}
                name="banner"
                aspect="aspect-[21/9]"
                label="อัปโหลดแบนเนอร์"
              />
            </div>
          </div>
        )}
      </Modal>

      <Confirm
        open={!!deleteTarget} onClose={()=>setDeleteTarget(null)} onConfirm={confirmDelete}
        title="ลบหมวดหมู่" danger
        message={`คุณต้องการลบ "${deleteTarget?.name}" ใช่หรือไม่?\nการลบจะไม่ลบสินค้าในหมวดนี้`}
        confirmText="ลบ"
      />
    </div>
  );
}

                     onChange={e=>setEditing(x=>({...x,order:e.target.value}))}/>
              <label className="flex items-center gap-2 self-end pb-2.5">
                <input type="checkbox" checked={editing.active !== false}
                       onChange={e=>setEditing(x=>({...x,active:e.target.checked}))}/>
                <span>แสดงบนหน้าแรก</span>
              </label>
            </div>

            {editing.value && (
              <div className="rounded-xl bg-slate-50 border border-slate-200 p-3 text-sm">
                <div className="text-slate-500 text-xs mb-1">ตัวอย่าง:</div>
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{editing.icon || '🔗'}</span>
                  <div>
                    <div className="font-medium">{editing.label || 'ชื่อช่องทาง'}</div>
                    <div className="text-xs text-slate-500">{editing.value}</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
      </Modal>

      <Confirm
        open={!!deleteTarget} onClose={()=>setDeleteTarget(null)} onConfirm={confirmDelete}
        title="ลบช่องทางติดต่อ" danger
        message={`คุณต้องการลบ "${deleteTarget?.label}" ใช่หรือไม่?`}
        confirmText="ลบ"
      />
    </div>
  );
}

/* =============================================================
   ADMIN: DASHBOARD
   ============================================================= */
function DashboardPage() {
  const [loading, setLoading] = useState(true);
  const [products, setProducts] = useState([]);
  const [warranties, setWarranties] = useState([]);
  const [claims, setClaims] = useState([]);
  const [sales, setSales] = useState([]);

  useEffect(()=>{(async()=>{
    try {
      const safe = (p) => p.catch(e => { console.warn('load fail:', e.message); return []; });
      const [p,w,c,s] = await Promise.all([
        safe(listProducts()), safe(listWarranties()), safe(listClaims()), safe(listSales())
      ]);
      setProducts(p); setWarranties(w); setClaims(c); setSales(s);
    } finally { setLoading(false); }
  })();},[]);

  const stats = useMemo(()=>{
    const now = new Date();
    const sD = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const sM = new Date(now.getFullYear(),now.getMonth(),1);
    const sY = new Date(now.getFullYear(),0,1);
    const totalStock = products.reduce((a,p)=>a+(p.stock||0),0);
    const lowStock = products.filter(p=>(p.stock||0)>0 && (p.stock||0)<=(p.threshold??5)).length;
    const outStock = products.filter(p=>(p.stock||0)<=0).length;
    const at = s => toDate(s.createdAt) || new Date(0);
    const f = d => sales.filter(s=>at(s)>=d);
    const sum = (arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
    const active = warranties.filter(w=>warrantyStatus(w.endDate).status==='ACTIVE').length;
    const claimCounts = claims.reduce((a,c)=>{a[c.status]=(a[c.status]||0)+1; return a;},{});
    return { totalStock, lowStock, outStock,
      salesToday: f(sD).length, salesMonth: f(sM).length,
      revenueToday: sum(f(sD),'revenue'), revenueMonth: sum(f(sM),'revenue'),
      revenueYear: sum(f(sY),'revenue'), revenue: sum(sales,'revenue'),
      cost: sum(sales,'cost'), profit: sum(sales,'profit'),
      wActive: active, wExpired: warranties.length-active, claimCounts };
  },[products,warranties,claims,sales]);

  const revenueByDay = useMemo(()=>{
    const arr = [];
    for (let i=13;i>=0;i--) {
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
      arr.push({date:d, label:d.toLocaleDateString('th-TH',{day:'2-digit',month:'short'}), revenue:0, sales:0});
    }
    sales.forEach(s=>{
      const dt = toDate(s.createdAt); if (!dt) return;
      const found = arr.find(a=>a.date.toDateString()===dt.toDateString());
      if (found) { found.revenue += s.revenue||0; found.sales += s.qty||0; }
    });
    return arr;
  },[sales]);

  const topProducts = useMemo(()=>{
    const map = {};
    sales.forEach(s=>{ map[s.productName] = (map[s.productName]||0)+(s.qty||0); });
    return Object.entries(map).map(([name,qty])=>({name,qty})).sort((a,b)=>b.qty-a.qty).slice(0,5);
  },[sales]);

  if (loading) return <Spinner/>;

  const Stat = ({label, value, icon, tone='slate'}) => {
    const tones = {slate:'text-slate-900', green:'text-emerald-600', red:'text-rose-600', amber:'text-amber-600'};
    return (
      <div className="bg-white rounded-2xl border border-slate-200 p-4">
        <div className="flex items-center justify-between">
          <span className="text-xs text-slate-500">{label}</span>
          {icon && <span>{icon}</span>}
        </div>
        <div className={`mt-2 text-lg sm:text-xl font-bold ${tones[tone]}`}>{value}</div>
      </div>
    );
  };

  const lineData = { labels: revenueByDay.map(x=>x.label),
    datasets: [{label:'รายได้', data: revenueByDay.map(x=>x.revenue), borderColor:'#1f36eb',
      backgroundColor:'rgba(31,54,235,0.08)', tension:0.35, fill:true, pointRadius:0}] };
  const barData = { labels: revenueByDay.map(x=>x.label),
    datasets: [{label:'จำนวนที่ขาย', data: revenueByDay.map(x=>x.sales), backgroundColor:'#1f36eb', borderRadius:6}] };
  const topData = { labels: topProducts.map(x=>x.name),
    datasets: [{label:'จำนวน', data: topProducts.map(x=>x.qty), backgroundColor:'#22c55e', borderRadius:6}] };
  const warrantyData = { labels: ['อยู่ในประกัน','หมดประกัน'],
    datasets: [{data:[stats.wActive, stats.wExpired], backgroundColor:['#22c55e','#ef4444']}] };
  const claimData = { labels: CLAIM_STATUSES.map(s=>STATUS_LABELS[s]),
    datasets: [{data: CLAIM_STATUSES.map(s=>stats.claimCounts[s]||0),
      backgroundColor:['#f59e0b','#3b82f6','#22c55e','#ef4444','#a855f7','#94a3b8']}] };

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl font-bold text-slate-900">Dashboard</h1>
        <p className="text-sm text-slate-500">ภาพรวมระบบ</p>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <Stat label="สินค้าทั้งหมด" value={fmtNum(products.length)} icon="🔋"/>
        <Stat label="Stock คงเหลือ" value={fmtNum(stats.totalStock)} icon="📦"/>
        <Stat label="สินค้าใกล้หมด" value={fmtNum(stats.lowStock)} icon="⚠️" tone="amber"/>
        <Stat label="สินค้าหมด" value={fmtNum(stats.outStock)} icon="⛔" tone="red"/>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <Stat label="ยอดขายวันนี้" value={fmtNum(stats.salesToday)} icon="🧾"/>
        <Stat label="ยอดขายเดือนนี้" value={fmtNum(stats.salesMonth)} icon="📅"/>
        <Stat label="Warranty ทั้งหมด" value={fmtNum(warranties.length)} icon="🛡️"/>
        <Stat label="Claim ทั้งหมด" value={fmtNum(claims.length)} icon="🔧"/>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
        <Stat label="รายได้วันนี้" value={fmtTHB(stats.revenueToday)} tone="green"/>
        <Stat label="รายได้เดือนนี้" value={fmtTHB(stats.revenueMonth)} tone="green"/>
        <Stat label="รายได้ทั้งหมด" value={fmtTHB(stats.revenue)} tone="green"/>
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
        <Card title="ต้นทุนรวม"><div className="text-xl font-bold">{fmtTHB(stats.cost)}</div></Card>
        <Card title="กำไรโดยประมาณ"><div className="text-xl font-bold text-emerald-600">{fmtTHB(stats.profit)}</div></Card>
        <Card title="Warranty Active / Expired">
          <div className="flex gap-2 flex-wrap">
            <Badge color="green">{stats.wActive} Active</Badge>
            <Badge color="red">{stats.wExpired} Expired</Badge>
          </div>
        </Card>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card title="รายได้ 14 วันล่าสุด"><ChartBox type="line" data={lineData}/></Card>
        <Card title="จำนวนสินค้าที่ขาย"><ChartBox type="bar" data={barData}/></Card>
        <Card title="สินค้าขายดี (Top 5)">
          {topProducts.length ? <ChartBox type="bar" data={topData} options={{indexAxis:'y'}}/> : <EmptyState/>}
        </Card>
        <Card title="Warranty Status"><ChartBox type="doughnut" data={warrantyData}/></Card>
        <Card title="Claim Status" className="lg:col-span-2"><ChartBox type="doughnut" data={claimData}/></Card>
      </div>
    </div>
  );
}
