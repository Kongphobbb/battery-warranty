   ADMIN: PRODUCTS
   ============================================================= */
function stockBadge(p) {
  const s = p.stock||0; const th = p.threshold??5;
  if (s<=0) return <Badge color="red">หมด</Badge>;
  if (s<=th) return <Badge color="amber">ใกล้หมด</Badge>;
  return <Badge color="green">มีสินค้า</Badge>;
}

function ProductsPage() {
  const { user } = useAuth();
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [priceTarget, setPriceTarget] = useState(null);
  const [newPrice, setNewPrice] = useState('');
  const [stockTarget, setStockTarget] = useState(null);
  const [stockQty, setStockQty] = useState('');
  const [stockReason, setStockReason] = useState('รับสินค้าเข้า');
  const [deleteTarget, setDeleteTarget] = useState(null);

  const load = async () => {
    setLoading(true);
    try {
      const [p, c] = await Promise.all([listProducts(), listCategories()]);
      setItems(p); setCategories(c);
    } catch { toast.error('โหลดข้อมูลไม่สำเร็จ'); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ load(); },[]);

  const catName = (id) => categories.find(c=>c.id===id)?.name || id || '-';

  const filtered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    return items.filter(p=>{
      if (filter==='active' && !p.active) return false;
      if (filter==='inactive' && p.active) return false;
      if (filter==='low' && !((p.stock||0)>0 && (p.stock||0)<=(p.threshold??5))) return false;
      if (filter==='out' && (p.stock||0)>0) return false;
      if (!q) return true;
      return (p.name||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q);
    });
  },[items,search,filter]);

  const submitPrice = async () => {
    const val = Number(newPrice);
    if (!Number.isFinite(val) || val<0) { toast.error('ราคาไม่ถูกต้อง'); return; }
    try {
      await changePrice(priceTarget.id, priceTarget, val, user);
      toast.success('เปลี่ยนราคาสำเร็จ');
      setPriceTarget(null); setNewPrice('');
      await load();
    } catch(e) { toast.error(e.message||'ไม่สำเร็จ'); }
  };

  const submitStock = async () => {
    const delta = Number(stockQty);
    if (!Number.isFinite(delta)||delta===0) { toast.error('จำนวนไม่ถูกต้อง'); return; }
    try {
      await adjustStock(stockTarget.id, delta, stockReason, user);
      toast.success('ปรับ Stock สำเร็จ');
      setStockTarget(null); setStockQty(''); setStockReason('รับสินค้าเข้า');
      await load();
    } catch(e) { toast.error(e.message||'ไม่สำเร็จ'); }
  };

  const confirmDelete = async () => {
    try {
      await softDeleteProduct(deleteTarget.id, deleteTarget, user);
      toast.success('ปิดการใช้งานแล้ว');
      setDeleteTarget(null);
      await load();
    } catch(e) { toast.error(e.message||'ไม่สำเร็จ'); }
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold">สินค้า</h1>
          <p className="text-sm text-slate-500">จัดการสินค้า ราคา และ Stock</p>
        </div>
        <a href="#/admin/products/new"><Button>+ เพิ่มสินค้า</Button></a>
      </div>
      <Card>
        <div className="grid sm:grid-cols-3 gap-3 mb-4">
          <div className="sm:col-span-2">
            <Input placeholder="ค้นหาชื่อสินค้า, SKU, รหัส..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <Input as="select" value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">ทั้งหมด</option>
            <option value="active">ใช้งาน</option>
            <option value="inactive">ปิดการใช้งาน</option>
            <option value="low">ใกล้หมด</option>
            <option value="out">หมด</option>
          </Input>
        </div>
        {loading ? <Spinner/> : filtered.length===0 ? <EmptyState/> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm responsive-table">
              <thead className="text-left text-slate-500 border-b border-slate-200">
                <tr>
                  <th className="py-2">สินค้า</th><th className="py-2">SKU</th>
                  <th className="py-2">หมวดหมู่</th>
                  <th className="py-2">ราคา</th><th className="py-2">Stock</th>
                  <th className="py-2">ประกัน</th><th className="py-2">สถานะ</th>
                  <th className="py-2 text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(p=>(
                  <tr key={p.id} className="border-b border-slate-100">
                    <td data-label="สินค้า" className="py-3">
                      <div className="flex items-center gap-3">
                        <img src={p.images?.[0]?.url||'https://placehold.co/48x48?text=—'} alt="" className="w-10 h-10 rounded-lg object-cover bg-slate-100"/>
                        <div className="min-w-0">
                          <div className="font-medium text-slate-800 truncate">{p.name}</div>
                          <div className="text-xs text-slate-500">{p.code||'-'}</div>
                        </div>
                      </div>
                    </td>
                    <td data-label="SKU" className="py-3 text-slate-600">{p.sku||'-'}</td>
                    <td data-label="หมวดหมู่" className="py-3 text-slate-600 text-xs">{catName(p.categoryId)}</td>
                    <td data-label="ราคา" className="py-3">{fmtTHB(p.price)}</td>
                    <td data-label="Stock" className="py-3">{p.stock||0}</td>
                    <td data-label="ประกัน" className="py-3">{p.warrantyMonths||0} ด.</td>
                    <td data-label="สถานะ" className="py-3">
                      <div className="flex gap-2 items-center flex-wrap">
                        {p.active ? <Badge color="blue">ใช้งาน</Badge> : <Badge color="slate">ปิด</Badge>}
                        {stockBadge(p)}
                      </div>
                    </td>
                    <td data-label="จัดการ" className="py-3 text-right">
                      <div className="inline-flex flex-wrap gap-1.5 justify-end">
                        <a href={`#/admin/products/${p.id}`}><Button size="sm" variant="outline">แก้ไข</Button></a>
                        <Button size="sm" variant="secondary" onClick={()=>{setPriceTarget(p);setNewPrice(String(p.price||0));}}>ราคา</Button>
                        <Button size="sm" variant="secondary" onClick={()=>setStockTarget(p)}>Stock</Button>
                        {p.active && <Button size="sm" variant="danger" onClick={()=>setDeleteTarget(p)}>ปิด</Button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={!!priceTarget} onClose={()=>setPriceTarget(null)} title="เปลี่ยนราคา"
        footer={<div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={()=>setPriceTarget(null)}>ยกเลิก</Button>
          <Button onClick={submitPrice}>ยืนยัน</Button>
        </div>}>
        {priceTarget && (
          <div className="space-y-3">
            <div className="text-sm text-slate-600">สินค้า: <b>{priceTarget.name}</b></div>
            <div className="text-sm">ราคาเดิม: <b>{fmtTHB(priceTarget.price)}</b></div>
            <Input label="ราคาใหม่" type="number" min="0" value={newPrice} onChange={e=>setNewPrice(e.target.value)}/>
          </div>
        )}
      </Modal>

      <Modal open={!!stockTarget} onClose={()=>setStockTarget(null)} title="ปรับ Stock"
        footer={<div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={()=>setStockTarget(null)}>ยกเลิก</Button>
          <Button onClick={submitStock}>บันทึก</Button>
        </div>}>
        {stockTarget && (
          <div className="space-y-3">
            <div className="text-sm text-slate-600">Stock ปัจจุบัน: <b>{stockTarget.stock||0}</b></div>
            <Input label="จำนวน (ใส่ + หรือ -)" type="number" value={stockQty} onChange={e=>setStockQty(e.target.value)} placeholder="+10 หรือ -5"/>
            <Input as="select" label="เหตุผล" value={stockReason} onChange={e=>setStockReason(e.target.value)}>
              <option>รับสินค้าเข้า</option><option>ขายสินค้า</option><option>คืนสินค้า</option>
              <option>สินค้าชำรุด</option><option>ปรับ Stock</option><option>อื่น ๆ</option>
            </Input>
          </div>
        )}
      </Modal>

      <Confirm open={!!deleteTarget} onClose={()=>setDeleteTarget(null)} onConfirm={confirmDelete}
        title="ปิดการใช้งานสินค้า" danger
        message={`คุณต้องการปิดการใช้งาน "${deleteTarget?.name}" ใช่หรือไม่?`}
        confirmText="ปิดการใช้งาน"/>
    </div>
  );
}

/* ---------- PRODUCT FORM ---------- */
function ProductFormPage({id}) {
  const { user } = useAuth();
  const toast = useToast();
  const isEdit = !!id;
  const empty = {name:'',code:'',sku:'',categoryId:'',description:'',cost:0,price:0,salePrice:0,stock:0,threshold:5,warrantyMonths:12,active:true,images:[]};
  const [form, setForm] = useState(empty);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(isEdit);
  const [saving, setSaving] = useState(false);
  const [errors, setErrors] = useState({});

  useEffect(()=>{
    (async()=>{
      try {
        const cats = await listCategories();
        setCategories(cats);
        if (isEdit) {
          const p = await getProduct(id);
          if (!p) { toast.error('ไม่พบสินค้า'); window.location.hash='#/admin/products'; return; }
          setForm({...empty, ...p});
        }
      } catch { toast.error('โหลดไม่สำเร็จ'); }
      finally { setLoading(false); }
    })();
  },[id]);

  const setField = (k,v) => setForm(f=>({...f,[k]:v}));

  const validate = () => {
    const e = {};
    if (!form.name?.trim()) e.name = 'กรุณากรอกชื่อสินค้า';
    if (Number(form.cost)<0) e.cost = 'ราคาทุนต้องไม่ติดลบ';
    if (Number(form.price)<0) e.price = 'ราคาขายต้องไม่ติดลบ';
    if (Number(form.stock)<0) e.stock = 'Stock ต้องไม่ติดลบ';
    setErrors(e);
    return !Object.keys(e).length;
  };

  const submit = async (ev) => {
    ev.preventDefault();
    if (!validate()) return;
    setSaving(true);
    try {
      const payload = {
        name: form.name.trim(), code: form.code||'', sku: form.sku||'',
        categoryId: form.categoryId||'', category: form.categoryId||'',
        description: form.description||'',
        cost: Number(form.cost)||0, price: Number(form.price)||0,
        salePrice: Number(form.salePrice)||0, stock: Number(form.stock)||0,
        threshold: Number(form.threshold)||0,
        warrantyMonths: Number(form.warrantyMonths)||12,
        active: !!form.active, images: form.images||[]
      };
      if (isEdit) { await updateProduct(id, form, payload, user); toast.success('บันทึกสำเร็จ'); }
      else { await createProduct(payload, user); toast.success('เพิ่มสินค้าสำเร็จ'); }
      window.location.hash = '#/admin/products';
    } catch(e) { toast.error(e.message||'บันทึกไม่สำเร็จ'); }
    finally { setSaving(false); }
  };

  if (loading) return <Spinner/>;

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <h1 className="text-2xl font-bold">{isEdit?'แก้ไขสินค้า':'เพิ่มสินค้า'}</h1>
        <a href="#/admin/products"><Button variant="outline">← กลับ</Button></a>
      </div>
      <form onSubmit={submit} className="grid lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 space-y-5">
          <Card title="ข้อมูลสินค้า">
            <div className="grid sm:grid-cols-2 gap-4">
              <Input label="ชื่อสินค้า *" value={form.name} onChange={e=>setField('name',e.target.value)} error={errors.name}/>
              <Input label="รหัสสินค้า" value={form.code} onChange={e=>setField('code',e.target.value)}/>
              <Input label="SKU" value={form.sku} onChange={e=>setField('sku',e.target.value)}/>
              <Input as="select" label="หมวดหมู่" value={form.categoryId||''} onChange={e=>setField('categoryId',e.target.value)}>
                <option value="">-- ไม่ระบุ --</option>
                {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </Input>
              <div className="sm:col-span-2">
                <Input as="textarea" rows={3} label="รายละเอียด" value={form.description} onChange={e=>setField('description',e.target.value)}/>
              </div>
            </div>
          </Card>
          <Card title="ราคา">
            <div className="grid sm:grid-cols-3 gap-4">
              <Input label="ราคาทุน" type="number" min="0" value={form.cost} onChange={e=>setField('cost',e.target.value)} error={errors.cost}/>
              <Input label="ราคาขาย" type="number" min="0" value={form.price} onChange={e=>setField('price',e.target.value)} error={errors.price}/>
              <Input label="ราคาพิเศษ" type="number" min="0" value={form.salePrice} onChange={e=>setField('salePrice',e.target.value)}/>
            </div>
          </Card>
          <Card title="Stock & ประกัน">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1.5">จำนวน Stock *</label>
                <div className="flex gap-2 items-stretch">
                  <button type="button"
                    onClick={()=>setField('stock', Math.max(0, (Number(form.stock)||0)-1))}
                    className="w-12 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 active:bg-slate-100 font-bold text-xl text-slate-600 transition">
                    −
                  </button>
                  <input type="number" min="0" value={form.stock}
                    onChange={e=>setField('stock',e.target.value)}
                    className={`flex-1 rounded-lg border px-3.5 py-2.5 text-sm outline-none text-center font-semibold
                      ${errors.stock ? 'border-rose-400' : 'border-slate-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-100'}`}/>
                  <button type="button"
                    onClick={()=>setField('stock', (Number(form.stock)||0)+1)}
                    className="w-12 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 active:bg-slate-100 font-bold text-xl text-slate-600 transition">
                    +
                  </button>
                </div>
                <div className="flex gap-1.5 mt-2 flex-wrap">
                  {[-10,-5,+5,+10,+50].map(delta => (
                    <button key={delta} type="button"
                      onClick={()=>setField('stock', Math.max(0, (Number(form.stock)||0)+delta))}
                      className={`px-3 py-1 rounded-lg text-xs font-medium border transition
                        ${delta > 0
                          ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100'
                          : 'border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100'}`}>
                      {delta > 0 ? `+${delta}` : delta}
                    </button>
                  ))}
                  <button type="button"
                    onClick={()=>setField('stock', 0)}
                    className="px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100">
                    Reset
                  </button>
                </div>
                {errors.stock && <span className="block mt-1 text-xs text-rose-600">{errors.stock}</span>}
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                <Input label="Threshold แจ้งเตือน" type="number" min="0" value={form.threshold} onChange={e=>setField('threshold',e.target.value)}/>
                <Input label="ประกัน (เดือน)" type="number" min="0" value={form.warrantyMonths} onChange={e=>setField('warrantyMonths',e.target.value)}/>
              </div>
            </div>
          </Card>
          <Card title="รูปสินค้า">
            <ImageUploader images={form.images||[]} onChange={imgs=>setField('images',imgs)} productId={id||'temp'}/>
          </Card>
        </div>
        <div className="space-y-5">
          <Card title="สถานะ">
            <label className="flex items-center gap-2">
              <input type="checkbox" checked={form.active} onChange={e=>setField('active',e.target.checked)}/>
              <span>เปิดใช้งานสินค้า (แสดงบนหน้าแรก)</span>
            </label>
          </Card>
          <Card>
            <Button type="submit" size="lg" className="w-full" disabled={saving}>
              {saving?'กำลังบันทึก...':'บันทึก'}
            </Button>
          </Card>
        </div>
      </form>
    </div>
  );
}

/* =============================================================
   ADMIN: WARRANTIES
   ============================================================= */
function WarrantiesPage() {
  const { user } = useAuth();
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [open, setOpen] = useState(false);
  const [saving, setSaving] = useState(false);
  const todayStr = () => toDateInput(new Date());
  const [form, setForm] = useState({serialNumber:'',productId:'',productName:'',purchaseDate:todayStr(),startDate:todayStr(),months:12,customerName:''});
  const [deleteTarget, setDeleteTarget] = useState(null);
  const load = async () => {
    setLoading(true);
    try {
      const [w,p] = await Promise.all([listWarranties(), listProducts()]);
      setItems(w); setProducts(p);
    } catch (err) {
      console.error('[Warranties] load error:', err);
      toast.error('โหลดไม่สำเร็จ: ' + (err.message || err.code || 'unknown'));
    }
    finally { setLoading(false); }
  };
  useEffect(()=>{ load(); },[]);

  const filtered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    if (!q) return items;
    return items.filter(w =>
      (w.serialNumber||'').toLowerCase().includes(q)
      || (w.productName||'').toLowerCase().includes(q)
      || (w.customerName||'').toLowerCase().includes(q));
  },[items,search]);

  const submit = async () => {
    if (!form.serialNumber.trim()) { toast.error('กรุณากรอก Serial Number'); return; }
    if (!form.productId) { toast.error('กรุณาเลือกสินค้า'); return; }
    setSaving(true);
    try {
      const selected = products.find(p=>p.id===form.productId);
      await createWarranty({
        serialNumber: form.serialNumber.trim().toUpperCase(),
        productId: form.productId, productName: selected?.name||'',
        purchaseDate: form.purchaseDate, startDate: form.startDate,
        months: Number(form.months)||12, customerName: form.customerName||''
      }, user);
      toast.success('เพิ่ม Warranty สำเร็จ');
      setOpen(false);
      setForm({serialNumber:'',productId:'',productName:'',purchaseDate:todayStr(),startDate:todayStr(),months:12,customerName:''});
      await load();
    } catch(e) { toast.error(e.message||'ไม่สำเร็จ'); }
    finally { setSaving(false); }
  };
  const confirmDelete = async () => {
    try {
      await deleteWarranty(deleteTarget.id, deleteTarget, user);
      toast.success('ลบ Warranty สำเร็จ');
      setDeleteTarget(null);
      await load();
    } catch(e) {
      toast.error(e.message||'ลบไม่สำเร็จ');
    }
  };

  const exportCSV = () => {
    downloadCSV('warranties.csv', filtered.map(w=>({
      Serial: w.serialNumber, Product: w.productName,
      Start: fmtDate(w.startDate), End: fmtDate(w.endDate),
      Months: w.months, Status: warrantyStatus(w.endDate).status,
      Customer: w.customerName||''
    })));
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-col sm:flex-row justify-between gap-3">
        <div>
          <h1 className="text-2xl font-bold">Warranty</h1>
          <p className="text-sm text-slate-500">จัดการการรับประกัน</p>
        </div>
        <div className="flex gap-2">
          <Button variant="outline" onClick={exportCSV}>Export CSV</Button>
          <Button onClick={()=>setOpen(true)}>+ เพิ่ม Warranty</Button>
        </div>
      </div>
      <Card>
        <Input placeholder="ค้นหา Serial / สินค้า / ลูกค้า..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="mt-4">
          {loading ? <Spinner/> : filtered.length===0 ? <EmptyState/> : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm responsive-table">
                <thead className="text-left text-slate-500 border-b border-slate-200">
                  <tr>
                    <th className="py-2">Serial</th><th className="py-2">สินค้า</th>
                    <th className="py-2">เริ่ม</th><th className="py-2">หมด</th>
                    <th className="py-2">สถานะ</th>
                    <th className="py-2 text-right">จัดการ</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(w=>{
                    const s = warrantyStatus(w.endDate);
                    return (
                      <tr key={w.id} className="border-b border-slate-100">
                        <td data-label="Serial" className="py-3 font-mono text-xs">{w.serialNumber}</td>
                        <td data-label="สินค้า" className="py-3">{w.productName}</td>
                        <td data-label="เริ่ม" className="py-3">{fmtDate(w.startDate)}</td>
                        <td data-label="หมด" className="py-3">{fmtDate(w.endDate)}</td>
                        <td data-label="สถานะ" className="py-3">
                          {s.status==='ACTIVE'
                            ? <Badge color="green">อยู่ในประกัน · {s.daysLeft} วัน</Badge>
                            : <Badge color="red">หมดประกัน</Badge>}
                        </td>
                        <td data-label="จัดการ" className="py-3 text-right">
                          <Button size="sm" variant="danger" onClick={()=>setDeleteTarget(w)}>
                            ลบ
                          </Button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </Card>

      <Modal open={open} onClose={()=>setOpen(false)} title="เพิ่ม Warranty" size="lg"
        footer={<div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={()=>setOpen(false)}>ยกเลิก</Button>
          <Button onClick={submit} disabled={saving}>{saving?'กำลังบันทึก...':'บันทึก'}</Button>
        </div>}>
        <div className="grid sm:grid-cols-2 gap-4">
          <Input label="Serial Number *" value={form.serialNumber} onChange={e=>setForm(f=>({...f,serialNumber:e.target.value.toUpperCase()}))}/>
          <Input as="select" label="สินค้า *" value={form.productId}
            onChange={e=>{
              const p = products.find(x=>x.id===e.target.value);
              setForm(f=>({...f,productId:e.target.value,productName:p?.name||'',months:p?.warrantyMonths||f.months}));
            }}>
            <option value="">-- เลือกสินค้า --</option>
            {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </Input>
        </div>
        {products.length === 0 && (
          <div className="rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm text-amber-800">
            ⚠️ ยังไม่มีสินค้าในระบบ — ไปที่เมนู <a href="#/admin/products/new" className="font-semibold underline">+ เพิ่มสินค้า</a> ก่อน
          </div>
        )}
        <div className="grid sm:grid-cols-2 gap-4">
          <Input label="วันที่ซื้อ" type="date" value={form.purchaseDate} onChange={e=>setForm(f=>({...f,purchaseDate:e.target.value}))}/>
          <Input label="วันที่เริ่มประกัน" type="date" value={form.startDate} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}/>
          <Input label="ระยะเวลา (เดือน)" type="number" min="1" value={form.months} onChange={e=>setForm(f=>({...f,months:e.target.value}))}/>
          <Input label="ชื่อลูกค้า" value={form.customerName} onChange={e=>setForm(f=>({...f,customerName:e.target.value}))}/>
        </div>
      </Modal>

      <Confirm
        open={!!deleteTarget}
        onClose={()=>setDeleteTarget(null)}
        onConfirm={confirmDelete}
        title="ลบ Warranty"
        danger
        message={`คุณต้องการลบ Warranty นี้ใช่หรือไม่?\n\nSerial: ${deleteTarget?.serialNumber || ''}\nสินค้า: ${deleteTarget?.productName || ''}\n\n⚠️ ข้อมูลจะถูกลบถาวร และไม่สามารถกู้คืนได้`}
        confirmText="ลบถาวร"
      />
    </div>
  );
}

/* =============================================================
   ADMIN: CLAIMS
    ============================================================= */
function ClaimsPage() {
  const { user } = useAuth();
  const toast = useToast();
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [editing, setEditing] = useState(null);
  const [newStatus, setNewStatus] = useState('');
  const [note, setNote] = useState('');

  const load = async () => {
    setLoading(true);
    try { setItems(await listClaims()); }
    catch { toast.error('โหลดไม่สำเร็จ'); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ load(); },[]);

  const filtered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    return items.filter(c=>{
      if (filter!=='all' && c.status!==filter) return false;
      if (!q) return true;
      return (c.serialNumber||'').toLowerCase().includes(q)
        || (c.productName||'').toLowerCase().includes(q);
    });
  },[items,search,filter]);

  const submit = async () => {
    try {
      await updateClaimStatus(editing.id, newStatus, user, {note});
      toast.success('อัปเดตสถานะสำเร็จ');
      setEditing(null); setNote('');
      await load();
    } catch(e) { toast.error(e.message||'ไม่สำเร็จ'); }
  };

  const statusColor = {PENDING:'amber', INSPECTING:'blue', APPROVED:'green', REJECTED:'red', REPLACED:'purple', COMPLETED:'slate'};

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold">Claim</h1>
        <p className="text-sm text-slate-500">จัดการรายการเคลม</p>
      </div>
      <Card>
        <div className="grid sm:grid-cols-3 gap-3">
          <div className="sm:col-span-2">
            <Input placeholder="ค้นหา Serial / สินค้า..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <Input as="select" value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">ทุกสถานะ</option>
            {CLAIM_STATUSES.map(s=><option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
          </Input>
        </div>
        <div className="mt-4">
          {loading ? <Spinner/> : filtered.length===0 ? <EmptyState/> : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm responsive-table">
                <thead className="text-left text-slate-500 border-b border-slate-200">
                  <tr>
                    <th className="py-2">Claim ID</th><th className="py-2">Serial</th>
                    <th className="py-2">สินค้า</th><th className="py-2">อาการ</th>
                    <th className="py-2">วันที่แจ้ง</th><th className="py-2">สถานะ</th>
                    <th className="py-2 text-right">จัดการ</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(c=>(
                    <tr key={c.id} className="border-b border-slate-100">
                      <td data-label="Claim ID" className="py-3 font-mono text-xs">{c.id.slice(0,8)}</td>
                      <td data-label="Serial" className="py-3 font-mono text-xs">{c.serialNumber}</td>
                      <td data-label="สินค้า" className="py-3">{c.productName}</td>
                      <td data-label="อาการ" className="py-3 max-w-[200px] truncate">{c.issue}</td>
                      <td data-label="วันที่แจ้ง" className="py-3">{fmtDateTime(c.createdAt)}</td>
                      <td data-label="สถานะ" className="py-3">
                        <Badge color={statusColor[c.status]}>{STATUS_LABELS[c.status]||c.status}</Badge>
                      </td>
                      <td data-label="จัดการ" className="py-3 text-right">
                        <Button size="sm" variant="outline" onClick={()=>{setEditing(c);setNewStatus(c.status);setNote(c.note||'');}}>
                          อัปเดต
                        </Button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </Card>

      <Modal open={!!editing} onClose={()=>setEditing(null)} title="อัปเดตสถานะ Claim"
        footer={<div className="flex justify-end gap-2">
          <Button variant="secondary" onClick={()=>setEditing(null)}>ยกเลิก</Button>
          <Button onClick={submit}>บันทึก</Button>
        </div>}>
        {editing && (
          <div className="space-y-3">
            <div className="text-sm text-slate-600">Serial: <b>{editing.serialNumber}</b></div>
            <Input as="select" label="สถานะ" value={newStatus} onChange={e=>setNewStatus(e.target.value)}>
              {CLAIM_STATUSES.map(s=><option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
            </Input>
            <Input as="textarea" label="หมายเหตุ" rows={3} value={note} onChange={e=>setNote(e.target.value)}/>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* =============================================================
   ADMIN: REVENUE
   ============================================================= */
function RevenuePage() {
  const [sales, setSales] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(()=>{(async()=>{
    try { setSales(await listSales()); }
    finally { setLoading(false); }
  })();},[]);

  const stats = useMemo(()=>{
    const now = new Date();
    const sD = new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const sM = new Date(now.getFullYear(),now.getMonth(),1);
    const sY = new Date(now.getFullYear(),0,1);
    const at = s => toDate(s.createdAt)||new Date(0);
    const f = d => sales.filter(s=>at(s)>=d);
    const sum = (arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
    return { today: sum(f(sD),'revenue'), month: sum(f(sM),'revenue'),
      year: sum(f(sY),'revenue'), total: sum(sales,'revenue'),
      cost: sum(sales,'cost'), profit: sum(sales,'profit'), salesCount: sales.length };
  },[sales]);

  if (loading) return <Spinner/>;

  const exportCSV = () => downloadCSV('revenue.csv', sales.map(s=>({
    Date: fmtDateTime(s.createdAt), Product: s.productName, Qty: s.qty,
    UnitPrice: s.unitPrice, Revenue: s.revenue, Cost: s.cost, Profit: s.profit
  })));

  const Box = ({label, value, tone}) => (
    <div className="bg-white rounded-2xl border border-slate-200 p-4">
      <div className="text-xs text-slate-500">{label}</div>
      <div className={`mt-2 text-lg sm:text-xl font-bold ${tone==='green'?'text-emerald-600':'text-slate-900'}`}>{value}</div>
    </div>
  );

  return (
    <div className="space-y-5">
      <div className="flex justify-between items-center gap-3 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold">รายได้</h1>
          <p className="text-sm text-slate-500">ภาพรวมรายได้และกำไร</p>
        </div>
        <Button variant="outline" onClick={exportCSV}>Export CSV</Button>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <Box label="รายได้วันนี้" value={fmtTHB(stats.today)}/>
        <Box label="รายได้เดือนนี้" value={fmtTHB(stats.month)}/>
        <Box label="รายได้ปีนี้" value={fmtTHB(stats.year)}/>
        <Box label="รายได้ทั้งหมด" value={fmtTHB(stats.total)}/>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <Box label="ยอดขายรวม" value={fmtNum(stats.salesCount)}/>
        <Box label="ต้นทุนรวม" value={fmtTHB(stats.cost)}/>
        <Box label="กำไรโดยประมาณ" value={fmtTHB(stats.profit)} tone="green"/>
        <Box label="อัตรากำไร" value={`${stats.total?((stats.profit/stats.total)*100).toFixed(1):0}%`}/>
      </div>
      <Card title="รายการขายล่าสุด">
        <div className="overflow-x-auto">
          <table className="w-full text-sm responsive-table">
            <thead className="text-left text-slate-500 border-b border-slate-200">
              <tr>
                <th className="py-2">วันที่</th><th className="py-2">สินค้า</th>
                <th className="py-2">จำนวน</th><th className="py-2">ราคา/หน่วย</th>
                <th className="py-2">รายได้</th><th className="py-2">กำไร</th>
              </tr>
            </thead>
            <tbody>
              {sales.slice(0,50).map(s=>(
                <tr key={s.id} className="border-b border-slate-100">
                  <td data-label="วันที่" className="py-2">{fmtDateTime(s.createdAt)}</td>
                  <td data-label="สินค้า" className="py-2">{s.productName}</td>
                  <td data-label="จำนวน" className="py-2">{s.qty}</td>
                  <td data-label="ราคา/หน่วย" className="py-2">{fmtTHB(s.unitPrice)}</td>
                  <td data-label="รายได้" className="py-2">{fmtTHB(s.revenue)}</td>
                  <td data-label="กำไร" className="py-2 text-emerald-600">{fmtTHB(s.profit)}</td>
                </tr>
              ))}
              {!sales.length && <tr><td colSpan={6}><EmptyState/></td></tr>}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* =============================================================
   ADMIN: REPORTS
   ============================================================= */
function ReportsPage() {
  const [loading, setLoading] = useState(true);
  const [products, setProducts] = useState([]);
  const [warranties, setWarranties] = useState([]);
  const [claims, setClaims] = useState([]);
  const [sales, setSales] = useState([]);
  const [from, setFrom] = useState(()=>{const d=new Date();d.setDate(1);return toDateInput(d);});
  const [to, setTo] = useState(toDateInput(new Date()));

  useEffect(()=>{(async()=>{
    try {
      const safe = (p) => p.catch(() => []);
      const [p,w,c,s] = await Promise.all([
        safe(listProducts()), safe(listWarranties()), safe(listClaims()), safe(listSales())
      ]);
      setProducts(p); setWarranties(w); setClaims(c); setSales(s);
    } finally { setLoading(false); }
  })();},[]);

  const salesFiltered = useMemo(()=>{
    const f = new Date(from); f.setHours(0,0,0,0);
    const t = new Date(to); t.setHours(23,59,59,999);
    return sales.filter(s=>{
      const at = toDate(s.createdAt);
      return at && at>=f && at<=t;
    });
  },[sales,from,to]);

  if (loading) return <Spinner/>;

  const ReportCard = ({title, subtitle, onExport}) => (
    <div className="bg-white rounded-2xl border border-slate-200 p-5">
      <div className="font-semibold text-slate-800">{title}</div>
      <div className="text-sm text-slate-500 mt-1">{subtitle}</div>
      <Button variant="outline" size="sm" className="mt-4 w-full" onClick={onExport}>Export CSV</Button>
    </div>
  );

  const Box = ({label, value, tone}) => (
    <div className="bg-slate-50 rounded-xl p-4">
      <div className="text-xs text-slate-500">{label}</div>
      <div className={`mt-1 text-lg font-bold ${tone==='green'?'text-emerald-600':''}`}>{value}</div>
    </div>
  );

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold">รายงาน</h1>
        <p className="text-sm text-slate-500">รายงานยอดขาย รายได้ Stock Warranty Claim</p>
      </div>

      <Card title="ช่วงเวลา">
        <div className="grid sm:grid-cols-3 gap-3">
          <Input label="จาก" type="date" value={from} onChange={e=>setFrom(e.target.value)}/>
          <Input label="ถึง" type="date" value={to} onChange={e=>setTo(e.target.value)}/>
        </div>
      </Card>

      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <ReportCard title="รายงานยอดขาย" subtitle={`${salesFiltered.length} รายการ`}
          onExport={()=>downloadCSV('report-sales.csv', salesFiltered.map(s=>({
            Date:fmtDate(s.createdAt), Product:s.productName, Qty:s.qty,
            Revenue:s.revenue, Cost:s.cost, Profit:s.profit
          })))}/>
        <ReportCard title="รายงาน Stock" subtitle={`${products.length} SKU`}
          onExport={()=>downloadCSV('report-stock.csv', products.map(p=>({
            Name:p.name, SKU:p.sku, Stock:p.stock, Threshold:p.threshold,
            Status:p.active?'active':'inactive'
          })))}/>
        <ReportCard title="รายงาน Warranty" subtitle={`${warranties.length} รายการ`}
          onExport={()=>downloadCSV('report-warranty.csv', warranties.map(w=>({
            Serial:w.serialNumber, Product:w.productName,
            Start:fmtDate(w.startDate), End:fmtDate(w.endDate),
            Status:warrantyStatus(w.endDate).status
          })))}/>
        <ReportCard title="รายงาน Claim" subtitle={`${claims.length} รายการ`}
          onExport={()=>downloadCSV('report-claims.csv', claims.map(c=>({
            ClaimId:c.id, Serial:c.serialNumber, Product:c.productName,
            Issue:c.issue, Status:c.status, Date:fmtDate(c.createdAt)
          })))}/>
      </div>

      <Card title="สรุปช่วงที่เลือก">
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <Box label="ยอดขาย" value={fmtNum(salesFiltered.length)}/>
          <Box label="รายได้" value={fmtTHB(salesFiltered.reduce((s,x)=>s+(x.revenue||0),0))}/>
          <Box label="ต้นทุน" value={fmtTHB(salesFiltered.reduce((s,x)=>s+(x.cost||0),0))}/>
          <Box label="กำไร" value={fmtTHB(salesFiltered.reduce((s,x)=>s+(x.profit||0),0))} tone="green"/>
        </div>
      </Card>
    </div>
  );
}

/* =============================================================
   ADMIN: AUDIT LOG
   ============================================================= */
function AuditPage() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');

  useEffect(()=>{(async()=>{
    try { setItems(await listAuditLogs(300)); }
    finally { setLoading(false); }
  })();},[]);

  const filtered = useMemo(()=>{
    const q = search.trim().toLowerCase();
    if (!q) return items;
    return items.filter(a =>
      (a.action||'').toLowerCase().includes(q)
      || (a.adminEmail||'').toLowerCase().includes(q)
      || JSON.stringify(a.details||{}).toLowerCase().includes(q));
  },[items,search]);

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl font-bold">Audit Log</h1>
        <p className="text-sm text-slate-500">ประวัติการทำงานของ Admin</p>
      </div>
      <Card>
        <Input placeholder="ค้นหา action / admin / รายละเอียด..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <div className="mt-4">
          {loading ? <Spinner/> : filtered.length===0 ? <EmptyState/> : (
            <div className="space-y-3">
              {filtered.map(a=>(
                <div key={a.id} className="rounded-xl border border-slate-200 p-4">
                  <div className="flex flex-wrap items-center gap-2 justify-between">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-semibold text-slate-800">{a.action}</span>
                      <span className="text-xs text-slate-500">{a.adminEmail||'-'}</span>
                    </div>
                    <span className="text-xs text-slate-400">{fmtDateTime(a.at)}</span>
                  </div>
                  <pre className="mt-2 text-xs bg-slate-50 rounded-lg p-3 overflow-x-auto text-slate-600">
                    {JSON.stringify(a.details||{}, null, 2)}
                  </pre>
                </div>
              ))}
            </div>
          )}
        </div>
      </Card>
    </div>
  );
}

/* =============================================================
   HASH ROUTER
   ============================================================= */
function useHash() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(()=>{
    const h = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', h);
    return ()=>window.removeEventListener('hashchange', h);
  },[]);
  return hash;
}

/* =============================================================
   APP
   ============================================================= */
function App() {
  const hash = useHash();
  const { user, isAdmin, loading } = useAuth();

  useEffect(() => {
    if (loading) return;
    if (user && isAdmin && hash === '#/admin/login') {
      window.location.hash = '#/admin/dashboard';
    }
  }, [loading, user, isAdmin, hash]);

  if (loading) {
    return <div className="min-h-screen grid place-items-center"><Spinner label="กำลังตรวจสอบสิทธิ์..."/></div>;
  }

  if (hash === '' || hash === '#/' || hash === '#') return <PublicLayout><HomePage/></PublicLayout>;
  if (hash === '#/check') return <PublicLayout><CheckWarrantyPage/></PublicLayout>;
if (hash === '#/products') return <PublicLayout><ProductsPublicPage/></PublicLayout>;
if (hash === '#/contact') return <PublicLayout><ContactPublicPage/></PublicLayout>;
  if (hash === '#/admin/login') return <LoginPage/>;

  if (hash.startsWith('#/admin')) {
    if (!user) {
      setTimeout(()=>{ window.location.hash = '#/admin/login'; }, 0);
      return <div className="min-h-screen grid place-items-center"><Spinner label="กำลังพาไปหน้า Login..."/></div>;
    }
    if (!isAdmin) {
      return (
        <div className="min-h-screen grid place-items-center p-6">
          <div className="max-w-md text-center bg-white rounded-2xl border border-slate-200 p-8">
            <div className="text-4xl mb-3">⛔</div>
            <h2 className="text-lg font-semibold text-slate-800">ไม่มีสิทธิ์เข้าถึง</h2>
            <p className="text-sm text-slate-500 mt-1">บัญชีนี้ไม่ได้เป็นผู้ดูแลระบบ</p>
            <div className="mt-4"><a href="#/admin/login"><Button variant="outline">กลับหน้า Login</Button></a></div>
          </div>
        </div>
      );
    }

    let page = null;
    if (hash === '#/admin' || hash === '#/admin/dashboard') page = <DashboardPage/>;
    else if (hash === '#/admin/products') page = <ProductsPage/>;
    else if (hash === '#/admin/products/new') page = <ProductFormPage/>;
    else if (hash.startsWith('#/admin/products/')) page = <ProductFormPage id={hash.replace('#/admin/products/','')}/>;
    else if (hash === '#/admin/categories') page = <CategoriesPage/>;
    else if (hash === '#/admin/contacts') page = <ContactsPage/>;
    else if (hash === '#/admin/warranties') page = <WarrantiesPage/>;
    else if (hash === '#/admin/claims') page = <ClaimsPage/>;
    else if (hash === '#/admin/revenue') page = <RevenuePage/>;
    else if (hash === '#/admin/reports') page = <ReportsPage/>;
    else if (hash === '#/admin/audit') page = <AuditPage/>;
    else page = <div className="p-8 text-center"><EmptyState title="ไม่พบหน้านี้" icon="🚫"/></div>;

    let current = hash;
    if (hash.startsWith('#/admin/products/')) current = '#/admin/products';

    return <AdminLayout current={current}>{page}</AdminLayout>;
  }

  return <PublicLayout><HomePage/></PublicLayout>;
}

/* =============================================================
   MOUNT
   ============================================================= */
ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthProvider><ToastProvider><App/></ToastProvider></AuthProvider>
);
</script>
</body>
</html>
